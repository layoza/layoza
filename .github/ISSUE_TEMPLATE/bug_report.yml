name: Bug report
description: Something in Layoza does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx layoza init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Layoza version
      placeholder: output of `npx layoza --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Cursor, Codex, Windsurf, OpenCode, Antigravity, CLI only, Other]
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
