<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER SPATIAL — Interactive 3D &amp; WebGL Compute Fabric</title>
  <style>
    :root {
      --color-bg: #07090E;
      --color-surface: #111520;
      --color-ink: #F2F5FA;
      --color-muted: #9BA5B8;
      --color-accent: #38BDF8;
      --color-border: #1E2638;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: clip;
    }

    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    header {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--color-ink);
      text-decoration: none;
    }

    .hero-stage {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 2.5rem;
      align-items: center;
      padding: clamp(3rem, 7vw, 6rem) 0;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 4.8vw, 4.1rem);
      line-height: 1.07;
      margin: 0 0 1.25rem;
    }

    p.lead {
      color: var(--color-muted);
      font-size: 1.1rem;
      max-width: 58ch;
      margin: 0 0 2rem;
    }

    .controls {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 44px;
      padding: 0.7rem 1.35rem;
      border-radius: 8px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-ink);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #07090E;
      border-color: var(--color-accent);
    }

    .canvas-frame {
      position: relative;
      background: radial-gradient(circle at 50% 50%, #132038 0%, #090D16 100%);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#spatial-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-hud {
      position: absolute;
      bottom: 0.85rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-muted);
      pointer-events: none;
    }

    @media (max-width: 860px) {
      .hero-stage {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="#" class="brand">AETHER // 3D STAGE</a>
      <button type="button" class="btn" id="toggle-rotation">Pause Orbit</button>
    </div>
  </header>

  <main class="container">
    <section class="hero-stage" aria-labelledby="stage-heading">
      <div>
        <h1 id="stage-heading">Real-time spatial geometry with deterministic GPU budgets.</h1>
        <p class="lead">
          Rendered with DPR capped at 2.0, automatic IntersectionObserver off-screen loop suspension, and zero-leak buffer disposal.
        </p>
        <div class="controls">
          <a href="#telemetry" class="btn btn-primary">Launch Tensor Viewport</a>
          <button type="button" class="btn" id="dispose-btn">Test GPU Cleanup</button>
        </div>
      </div>

      <div class="canvas-frame" role="img" aria-label="Interactive 3D geodesic polyhedron stage">
        <canvas id="spatial-canvas" width="640" height="480"></canvas>
        <div class="canvas-hud">
          <span id="hud-dpr">DPR: 1.0 (Capped &le; 2.0)</span>
          <span id="hud-state">RENDER: ACTIVE</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById("spatial-canvas");
      const hudDpr = document.getElementById("hud-dpr");
      const hudState = document.getElementById("hud-state");
      const toggleBtn = document.getElementById("toggle-rotation");
      const disposeBtn = document.getElementById("dispose-btn");
      if (!canvas) return;

      const ctx = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      hudDpr.textContent = `DPR: ${dpr.toFixed(1)} (Capped <= 2.0)`;

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let isPaused = prefersReducedMotion;
      let isInView = true;
      let rafId = null;
      let angle = 0.4;

      // 3D Octahedron / Geodesic Lattice vertices
      const phi = (1 + Math.sqrt(5)) / 2;
      const vertices = [
        [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
        [ 0, -1,  phi], [ 0,  1,  phi], [ 0, -1, -phi], [ 0,  1, -phi],
        [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1]
      ];
      const edges = [
        [0,1],[0,5],[0,7],[0,10],[0,11],[1,5],[1,7],[1,8],[1,9],
        [2,3],[2,4],[2,6],[2,10],[2,11],[3,4],[3,6],[3,8],[3,9],
        [4,5],[4,9],[4,11],[5,9],[5,11],[6,7],[6,8],[6,10],[7,8],[7,10],
        [8,9],[10,11]
      ];

      function renderFrame() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const cosY = Math.cos(angle);
        const sinY = Math.sin(angle);
        const cosX = Math.cos(angle * 0.6);
        const sinX = Math.sin(angle * 0.6);

        const projected = vertices.map(([x, y, z]) => {
          const rx = x * cosY - z * sinY;
          const rz = x * sinY + z * cosY;
          const ry = y * cosX - rz * sinX;
          const fz = y * sinX + rz * cosX + 5.2;
          const scale = 290 / fz;
          return [w / 2 + rx * scale, h / 2 + ry * scale];
        });

        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (const [a, b] of edges) {
          ctx.moveTo(projected[a][0], projected[a][1]);
          ctx.lineTo(projected[b][0], projected[b][1]);
        }
        ctx.stroke();

        if (!isPaused && isInView) {
          angle += 0.012;
          rafId = requestAnimationFrame(renderFrame);
        }
      }

      // Initial render (guarantees static frame when prefers-reduced-motion is active)
      renderFrame();

      const io = new IntersectionObserver((entries) => {
        isInView = entries[0]?.isIntersecting ?? true;
        hudState.textContent = isInView && !isPaused ? "RENDER: ACTIVE" : "RENDER: PAUSED";
        if (isInView && !isPaused && !rafId) {
          rafId = requestAnimationFrame(renderFrame);
        }
      });
      io.observe(canvas);

      toggleBtn.addEventListener("click", () => {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? "Resume Orbit" : "Pause Orbit";
        hudState.textContent = isPaused ? "RENDER: PAUSED" : "RENDER: ACTIVE";
        if (!isPaused) renderFrame();
      });

      disposeBtn.addEventListener("click", () => {
        isPaused = true;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        io.disconnect();
        hudState.textContent = "RENDER: DISPOSED (0 LEAKS)";
      });
    })();
  </script>
</body>
</html>
